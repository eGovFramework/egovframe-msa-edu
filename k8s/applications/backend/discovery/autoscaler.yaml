apiVersion: autoscaling/v1
kind: HorizontalPodAutoscaler
metadata:
  name: discovery-hpa-cpu
  labels:
    env: production
    tier: backend
    app: discovery
    name: discovery-hpa-cpu
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: discovery-deployment
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70
