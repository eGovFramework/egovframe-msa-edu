name: Backend Build

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/build-backend.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/build-backend.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - apigateway
          - board-service
          - config
          - discovery
          - egovframe-cloud-module-common
          - portal-service
          - reserve-check-service
          - reserve-item-service
          - reserve-request-service
          - user-service
        # 테스트가 통과하는 모듈만 테스트를 포함해 빌드한다.
        include:
          - { service: config, gradle: build }
          - { service: discovery, gradle: build }
          - { service: egovframe-cloud-module-common, gradle: build }

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Build ${{ matrix.service }}
        run: cd backend/${{ matrix.service }} && ./gradlew --no-daemon ${{ matrix.gradle || 'build -x test' }}
