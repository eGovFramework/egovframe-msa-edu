name: Frontend Build

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/build-frontend.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/build-frontend.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - admin
          - portal

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/${{ matrix.app }}/package-lock.json

      - name: Install dependencies
        run: cd frontend/${{ matrix.app }} && npm ci

      - name: Build ${{ matrix.app }}
        # Next.js 11 의 webpack 이 MD4 해시를 쓰는데 OpenSSL 3(Node 17+)에는 없다.
        # 두 앱의 package.json engines 와 Dockerfile 은 node 14.8.0 을 선언한다.
        env:
          NODE_OPTIONS: --openssl-legacy-provider
        run: cd frontend/${{ matrix.app }} && npm run build --if-present
