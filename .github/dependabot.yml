version: 2
updates:
  # Gradle backend modules
  - package-ecosystem: "gradle"
    directories:
      - "/backend/apigateway"
      - "/backend/board-service"
      - "/backend/config"
      - "/backend/discovery"
      - "/backend/egovframe-cloud-module-common"
      - "/backend/portal-service"
      - "/backend/reserve-check-service"
      - "/backend/reserve-item-service"
      - "/backend/reserve-request-service"
      - "/backend/user-service"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Seoul"
    # Routine major upgrades are reviewed as explicit migrations. This only
    # limits version updates; Dependabot security updates remain enabled.
    allow:
      - dependency-type: "all"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"
    groups:
      gradle-dependencies:
        group-by: "dependency-name"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
      include: "scope"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Seoul"
    groups:
      github-actions:
        patterns:
          - "*"
    open-pull-requests-limit: 1
    commit-message:
      prefix: "ci"
      include: "scope"

  # Docker images (Dockerfile, DockerfileK8s under each backend service)
  - package-ecosystem: "docker"
    directories:
      - "/backend/apigateway"
      - "/backend/board-service"
      - "/backend/config"
      - "/backend/discovery"
      - "/backend/portal-service"
      - "/backend/reserve-check-service"
      - "/backend/reserve-item-service"
      - "/backend/reserve-request-service"
      - "/backend/user-service"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Seoul"
    # Keep the declared runtime line stable; major image changes are manual.
    allow:
      - dependency-type: "all"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"
    groups:
      docker-images:
        group-by: "dependency-name"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "docker"
      include: "scope"
