spring:
  application:
    name: reserve-check-service

  main:
    web-application-type: reactive
    allow-bean-definition-overriding: true

  # 테스트는 config server / eureka / rabbit 에 연결하지 않는다.
  cloud:
    config:
      enabled: false
      fail-fast: false
    discovery:
      enabled: false
    bus:
      enabled: false
    stream:
      function:
        autodetect: false
    function:
      definition: ""
  rabbitmq:
    listener:
      simple:
        auto-startup: false
  sql:
    init:
      mode: never

  h2:
    console:
      enabled: true
      path: /h2

  logging.level:
    org.hibernate.SQL: debug

# 에러 메시지 fixture: src/test/resources/messages/messages.properties
messages:
  directory: ${user.dir}/src/test/resources/messages

management:
  tracing:
    enabled: false

# jwt token
token:
  secret: egovframe_user_token

# ftp server
ftp:
  enabled: false # ftp 사용 여부, FTP 서버에 최상위 디렉토리 자동 생성 및 구현체를 결정하게 된다.

# eureka 가 포함되면 eureka server 도 등록되므로 해제한다.
eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false
